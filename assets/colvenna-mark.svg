<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-labelledby="colvenna-mark-title colvenna-mark-desc">
  <title id="colvenna-mark-title">Colvenna</title>
  <desc id="colvenna-mark-desc">Three concentric teal flow lines form a C on a deep blue tile; the innermost line flows into a gold result point.</desc>

  <defs>
    <linearGradient id="colvenna-mark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11556B"/>
      <stop offset="1" stop-color="#062533"/>
    </linearGradient>
    <linearGradient id="colvenna-mark-flow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1BB59E"/>
      <stop offset="1" stop-color="#4FF2D6"/>
    </linearGradient>
    <g id="colvenna-mark-mark">
      <rect width="256" height="256" rx="56" fill="url(#colvenna-mark-bg)"/>
      <path d="M193.9 183.3 A86 86 0 1 1 193.9 72.7" fill="none" stroke="url(#colvenna-mark-flow)" stroke-opacity="1" stroke-width="15" stroke-linecap="round"/>
      <path d="M166.2 176.9 A62 62 0 1 1 181.7 97.0" fill="none" stroke="url(#colvenna-mark-flow)" stroke-opacity=".8" stroke-width="15" stroke-linecap="round"/>
      <path d="M143.5 162.7 A38 38 0 1 1 164.7 118.2" fill="none" stroke="url(#colvenna-mark-flow)" stroke-opacity=".6" stroke-width="15" stroke-linecap="round"/>
      <circle cx="186.7" cy="114.2" r="12" fill="#F5CB68"/>
    </g>
  </defs>
  <use href="#colvenna-mark-mark"/>
</svg>
